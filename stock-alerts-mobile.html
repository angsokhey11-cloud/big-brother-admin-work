<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIG BROTHER — Smart Stock Alerts Mobile</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f6fa;color:#213247;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button,input,select{font:inherit}.page{max-width:760px;margin:auto;padding:8px 8px calc(18px + env(safe-area-inset-bottom))}.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}.title{margin:0;color:#174a91;font-size:20px;line-height:1.12}.sub{margin-top:3px;color:#6d7f93;font-size:8px;line-height:1.3}.actions{display:flex;gap:5px;align-items:center}.btn{border:0;border-radius:9px;padding:8px 10px;font-weight:900;cursor:pointer;font-size:9px}.primary{background:#174a91;color:#fff}.ghost{background:#fff;color:#38556f;border:1px solid #d4deea}.pill{display:inline-block;border-radius:999px;padding:5px 7px;font-size:7px;font-weight:900;white-space:nowrap}.ok{background:#e8f7ef;color:#157a51}.warn{background:#fff6dd;color:#9a6700}.crit{background:#ffeded;color:#b42318}.info{background:#edf5ff;color:#245da8}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}.card{background:#fff;border:1px solid #dce5ef;border-radius:12px;box-shadow:0 3px 13px #173a660d;overflow:hidden}.stat{padding:9px}.stat span{font-size:6px;color:#74869b;font-weight:900;text-transform:uppercase;line-height:1.15}.stat strong{display:block;margin-top:4px;color:#234463;font-size:18px}.head{padding:9px 10px;border-bottom:1px solid #e6edf4;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px;color:#174a91}.alerts{width:100%}.alertrow{padding:8px 9px;border-bottom:1px solid #edf1f5;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:7px;align-items:center}.alertrow:last-child{border-bottom:0}.alert-title{font-weight:900;color:#294762;font-size:9px;line-height:1.2}.alert-msg{margin-top:2px;color:#6d7f93;font-size:7px;line-height:1.25}.atype{font-size:6px;color:#7a8a9c;text-align:right;max-width:84px;overflow-wrap:anywhere}.empty{padding:20px;text-align:center;color:#8493a5;font-size:9px}.settings{margin-top:8px}.settings-wrap{width:100%;overflow:hidden}.settings-table{width:100%;border-collapse:collapse;table-layout:fixed}.settings-table th,.settings-table td{padding:6px 4px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top;font-size:6.8px;line-height:1.2;overflow-wrap:anywhere}.settings-table th{background:#f7f9fc;color:#556b84;font-size:5.6px;text-transform:uppercase}.settings-table th:nth-child(1){width:31%}.settings-table th:nth-child(2){width:16%}.settings-table th:nth-child(3){width:13%}.settings-table th:nth-child(4){width:12%}.settings-table th:nth-child(5){width:13%}.settings-table th:nth-child(6){width:8%}.settings-table th:nth-child(7){width:7%}.meta{margin-top:2px;color:#7a8a9c;font-size:5.8px}.mini{padding:4px 5px;font-size:6px;border-radius:7px}.loading{position:fixed;inset:0;background:#f3f6faed;display:flex;align-items:center;justify-content:center;z-index:90}.loading.hide{display:none}.loadbox{background:#fff;border:1px solid #dce5ef;border-radius:13px;padding:16px 20px;color:#174a91;font-weight:900;font-size:10px}.errorbox{background:#fff0f0;border:1px solid #f2c9c6;color:#a82a23;border-radius:10px;padding:11px;font-size:9px}.overlay{position:fixed;inset:0;background:#eef3f8;display:none;z-index:70}.overlay.show{display:block}.modal{max-width:760px;min-height:100vh;margin:auto;background:#fff;display:flex;flex-direction:column}.modal-head{position:sticky;top:0;z-index:3;padding:12px;border-bottom:1px solid #e6edf4;background:#fff;display:flex;justify-content:space-between;align-items:center}.modal-title{margin:0;color:#174a91;font-size:16px}.close{width:36px;height:36px;border:0;border-radius:50%;font-size:18px}.modal-body{padding:10px;flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:7px;font-weight:900;color:#526981;margin-bottom:4px;text-transform:uppercase}.field input,.field select{width:100%;min-height:40px;border:1px solid #cbd7e4;border-radius:8px;padding:8px;background:#fff;font-size:10px}.check{grid-column:1/-1;display:flex;gap:8px;align-items:center;min-height:40px;font-size:9px}.check input{width:18px;height:18px}.modal-actions{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;background:#fff;border-top:1px solid #e6edf4}.modal-actions .btn{min-height:42px}.statusline{margin-bottom:8px;padding:8px;border:1px solid #dbe6f2;border-radius:9px;background:#eef5ff;color:#4f6780;font-size:8px}
@media(max-width:430px){.page{padding:6px}.top{grid-template-columns:1fr}.actions{justify-content:flex-start}.title{font-size:18px}.pill.secure{display:none}.alertrow{grid-template-columns:52px minmax(0,1fr) auto;gap:5px;padding:7px}.atype{max-width:64px;font-size:5.4px}.settings-table th,.settings-table td{padding:5px 3px;font-size:6px}.settings-table th{font-size:5px}.grid{grid-template-columns:1fr}.check{grid-column:auto}}
</style>
</head>
<body>
<div id="loading" class="loading"><div id="loadingText" class="loadbox">Loading Smart Stock Alerts…</div></div>
<div class="page">
  <div class="top">
    <div><h1 class="title">Smart Stock Alerts</h1><div class="sub">Low stock, expiry, damage, batch reconciliation and receiving alerts.</div></div>
    <div class="actions"><span class="pill ok secure">🔐 SUPABASE SECURE</span><button id="refreshBtn" class="btn ghost">↻ Refresh</button></div>
  </div>
  <div id="status" class="statusline">Loading live stock alerts…</div>
  <div id="content"></div>
</div>
<div id="modal" class="overlay"><div class="modal"><div class="modal-head"><h2 id="modalTitle" class="modal-title">Stock Alert Threshold</h2><button id="modalClose" class="close">×</button></div><div id="modalBody" class="modal-body"></div></div></div>
<script>
'use strict';
const SB_URL='https://sjfhlaclgmkwwofzstok.supabase.co',SB_KEY='sb_publishable_w762jR65CWwlO30fKQsYOw_6L9grx8S',SESSION_KEY='BB_SUPABASE_DEV_SESSION_V1';
let session=null,lastData={alerts:[],settings:[],products:[],locations:[]};
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const qty=v=>Number(v||0).toLocaleString(undefined,{maximumFractionDigits:3});
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(_){return null}}function saveSession(s){session=s||null;try{if(!s)localStorage.removeItem(SESSION_KEY);else{if(!s.expires_at&&s.expires_in)s.expires_at=Math.floor(Date.now()/1000)+Number(s.expires_in);localStorage.setItem(SESSION_KEY,JSON.stringify(s))}}catch(_){}}
async function parse(r){const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(_){d={message:t}}if(!r.ok)throw new Error(d.message||d.error_description||d.error||('Request failed '+r.status));return d}
async function refreshSession(){const s=readSession();if(!s?.refresh_token)throw new Error('Please sign in from the BIG BROTHER Dashboard.');const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token}),cache:'no-store'});saveSession(await parse(r));return session}
async function ensure(){session=readSession();if(!session?.access_token)throw new Error('Please sign in from the BIG BROTHER Dashboard.');if(session.expires_at&&Number(session.expires_at)<Math.floor(Date.now()/1000)+45)await refreshSession();return session}
async function rpc(fn,args={}){await ensure();let r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'});if(r.status===401){await refreshSession();r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'})}return parse(r)}
function badge(s){const x=String(s||'INFO').toUpperCase(),c=x==='CRITICAL'||x==='OVER_LIMIT'?'crit':x==='WARNING'||x==='OVERDUE'?'warn':x==='OK'?'ok':'info';return `<span class="pill ${c}">${esc(x)}</span>`}
function setLoading(on,text='Loading…'){$('loadingText').textContent=text;$('loading').classList.toggle('hide',!on)}
function render(){const d=lastData;$('content').innerHTML=`<div class="cards"><div class="card stat"><span>Critical Alerts</span><strong>${d.criticalCount||0}</strong></div><div class="card stat"><span>Warnings</span><strong>${d.warningCount||0}</strong></div><div class="card stat"><span>Configured Thresholds</span><strong>${(d.settings||[]).length}</strong></div></div><div class="card"><div class="head"><strong>Live Stock Alerts</strong><button class="btn primary" onclick="newStockRule()">＋ Threshold</button></div><div class="alerts">${(d.alerts||[]).map(x=>`<div class="alertrow"><div>${badge(x.severity)}</div><div><div class="alert-title">${esc(x.title)}</div><div class="alert-msg">${esc(x.message)}${x.locationCode?' · '+esc(x.locationCode):''}</div></div><div class="atype">${esc(x.type)}</div></div>`).join('')||'<div class="empty">No stock alerts right now.</div>'}</div></div><div class="card settings"><div class="head"><strong>Alert Threshold Settings</strong></div><div class="settings-wrap"><table class="settings-table"><thead><tr><th>Product</th><th>Location</th><th>Min Qty</th><th>Expiry</th><th>Damage 7D</th><th>Status</th><th></th></tr></thead><tbody>${(d.settings||[]).map((x,i)=>`<tr><td><strong>${esc(x.productName)}</strong><div class="meta">${esc(x.productCode)}</div></td><td>${esc(x.locationCode)}<div class="meta">${esc(x.locationName)}</div></td><td>${qty(x.minStockQty)}<div class="meta">${esc(x.unit)}</div></td><td>${Number(x.expiryWarningDays||0)}d</td><td>${qty(x.damageWarningQty)}<div class="meta">${esc(x.unit)}</div></td><td>${x.active?badge('OK'):badge('OFF')}</td><td><button class="btn ghost mini" onclick="editStockRule(${i})">Edit</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No thresholds configured yet.</td></tr>'}</tbody></table></div></div>`}
async function load(){setLoading(true,'Loading Smart Stock Alerts…');try{lastData=await rpc('bb_stock_alerts')||{};render();$('status').textContent=`Live alerts · ${lastData.criticalCount||0} critical · ${lastData.warningCount||0} warning · ${(lastData.settings||[]).length} threshold(s).`}catch(e){$('content').innerHTML=`<div class="errorbox"><strong>Could not open Smart Stock Alerts.</strong><div style="margin-top:5px">${esc(e.message||e)}</div></div>`;$('status').textContent=String(e.message||e)}finally{setLoading(false)}}
function closeModal(){$('modal').classList.remove('show')}$('modalClose').onclick=closeModal;
function stockModal(x={}){const products=lastData.products||[],locs=lastData.locations||[];$('modalTitle').textContent=(x.productCode?'Edit':'Add')+' Stock Alert Threshold';$('modalBody').innerHTML=`<div class="grid"><div class="field"><label>Product</label><select id="sProd" ${x.productCode?'disabled':''}>${products.map(p=>`<option value="${esc(p.productCode)}" ${p.productCode===x.productCode?'selected':''}>${esc(p.productName)} — ${esc(p.productCode)}</option>`).join('')}</select></div><div class="field"><label>Location</label><select id="sLoc" ${x.locationCode?'disabled':''}>${locs.map(l=>`<option value="${esc(l.locationCode)}" ${l.locationCode===x.locationCode?'selected':''}>${esc(l.locationCode)} — ${esc(l.locationName)}</option>`).join('')}</select></div><div class="field"><label>Minimum Good Stock Qty</label><input id="sMin" type="number" min="0" step="0.001" value="${Number(x.minStockQty||0)}"></div><div class="field"><label>Expiry Warning Days</label><input id="sExp" type="number" min="0" max="365" value="${Number(x.expiryWarningDays??14)}"></div><div class="field"><label>Damage Qty Alert (7 Days)</label><input id="sDmg" type="number" min="0" step="0.001" value="${Number(x.damageWarningQty||0)}"></div><label class="check"><input id="sActive" type="checkbox" ${x.active!==false?'checked':''}> Alert rule active</label></div><div class="modal-actions"><button id="cancelBtn" class="btn ghost">Cancel</button><button id="saveBtn" class="btn primary">Save Threshold</button></div>`;$('modal').classList.add('show');$('cancelBtn').onclick=closeModal;$('saveBtn').onclick=async()=>{setLoading(true,'Saving stock threshold…');try{await rpc('bb_stock_alert_setting_save',{p_payload:{productCode:x.productCode||$('sProd').value,locationCode:x.locationCode||$('sLoc').value,minStockQty:Number($('sMin').value||0),expiryWarningDays:Number($('sExp').value||14),damageWarningQty:Number($('sDmg').value||0),active:$('sActive').checked}});closeModal();await load()}catch(e){alert(e.message||e)}finally{setLoading(false)}}}
window.newStockRule=()=>stockModal({});window.editStockRule=i=>stockModal((lastData.settings||[])[i]||{});$('refreshBtn').onclick=load;load();
</script>
</body>
</html>
