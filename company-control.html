<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Company Control</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#213247;font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}.page{max-width:1600px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.title{margin:0;color:#174a91;font-size:27px}.sub{margin-top:5px;color:#6d7f93;font-size:12px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:900;cursor:pointer}.primary{background:#174a91;color:#fff}.ghost{background:#fff;color:#38556f;border:1px solid #d4deea}.danger{background:#fff0f0;color:#b42318;border:1px solid #f1c8c6}.okbtn{background:#157a51;color:#fff}.pill{display:inline-block;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900}.blue{background:#eaf3ff;color:#174a91}.ok{background:#e8f7ef;color:#157a51}.warn{background:#fff6dd;color:#9a6700}.crit{background:#ffeded;color:#b42318}.info{background:#edf5ff;color:#245da8}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}.card{background:#fff;border:1px solid #dce5ef;border-radius:13px;box-shadow:0 3px 13px #173a660d;overflow:hidden}.stat{padding:14px}.stat span{font-size:10px;color:#74869b;font-weight:900;text-transform:uppercase}.stat strong{display:block;margin-top:6px;color:#234463;font-size:21px}.head{padding:12px 14px;border-bottom:1px solid #e6edf4;display:flex;justify-content:space-between;gap:10px;align-items:center}.body{padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid #ccd8e5;border-radius:8px;padding:9px;background:#fff;min-width:170px}.tablewrap{overflow:auto;border:1px solid #dce5ee;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;font-size:11px;vertical-align:top}th{background:#f7f9fc;color:#556b84;font-size:10px;text-transform:uppercase;position:sticky;top:0;z-index:1}.money{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:35px;text-align:center;color:#8493a5}.alertrow{padding:12px 14px;border-bottom:1px solid #edf1f5;display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center}.alertrow:last-child{border-bottom:0}.alert-title{font-weight:900;color:#294762;font-size:12px}.alert-msg{margin-top:4px;color:#6d7f93;font-size:10px}.notif.unread{background:#f5f9ff}.activity-meta{font-size:10px;color:#7a8a9c;margin-top:4px}.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.overlay.show{display:flex}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.modal h2{margin:0 0 4px;color:#174a91}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.field label{display:block;font-size:10px;font-weight:900;color:#526981;margin-bottom:5px;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd7e4;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:70px}.full{grid-column:1/-1}.check{display:flex;gap:8px;align-items:center;min-height:38px;font-size:11px}.check input{width:17px;height:17px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.loading{position:fixed;inset:0;background:#f3f6faed;display:flex;align-items:center;justify-content:center;z-index:90}.loading.hide{display:none}.loadbox{background:#fff;border:1px solid #dce5ef;border-radius:13px;padding:18px 24px;color:#174a91;font-weight:900}.errorbox{background:#fff0f0;border:1px solid #f2c9c6;color:#a82a23;border-radius:10px;padding:13px}.section-note{font-size:10px;color:#73859a;margin:8px 0 13px}.locbar{height:8px;background:#e8eef6;border-radius:8px;overflow:hidden;margin-top:5px}.locbar>span{display:block;height:100%;background:#174a91}.nowrap{white-space:nowrap}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.alertrow{grid-template-columns:90px 1fr}}@media(max-width:700px){.page{padding:10px}.top{display:block}.actions{margin-top:10px}.cards,.grid{grid-template-columns:1fr}.alertrow{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div id="loading" class="loading"><div id="loadingText" class="loadbox">Loading BIG BROTHER…</div></div>
<div class="page"><div class="top"><div><h1 id="title" class="title">Company Control</h1><div id="subtitle" class="sub"></div></div><div class="actions"><span class="pill ok">🔐 SUPABASE SECURE</span><button id="refreshBtn" class="btn ghost">↻ Refresh</button></div></div><div id="content"></div></div>
<div id="modal" class="overlay"><div id="modalBody" class="modal"></div></div>
<script>
'use strict';
const SB_URL='https://sjfhlaclgmkwwofzstok.supabase.co',SB_KEY='sb_publishable_w762jR65CWwlO30fKQsYOw_6L9grx8S',SESSION_KEY='BB_SUPABASE_DEV_SESSION_V1';
const VIEW=(new URLSearchParams(location.search).get('view')||'management').toLowerCase();let session=null,lastData=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=(v,c='USD')=>String(c).toUpperCase()==='KHR'?'៛'+Number(v||0).toLocaleString(undefined,{maximumFractionDigits:0}):'$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const qty=v=>Number(v||0).toLocaleString(undefined,{maximumFractionDigits:3});
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(_){return null}}function saveSession(s){session=s||null;try{if(!s)localStorage.removeItem(SESSION_KEY);else{if(!s.expires_at&&s.expires_in)s.expires_at=Math.floor(Date.now()/1000)+Number(s.expires_in);localStorage.setItem(SESSION_KEY,JSON.stringify(s))}}catch(_){}}
async function parse(r){const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(_){d={message:t}}if(!r.ok)throw new Error(d.message||d.error_description||d.error||('Request failed '+r.status));return d}
async function refreshSession(){const s=readSession();if(!s?.refresh_token)throw new Error('Please sign in from the BIG BROTHER Dashboard.');const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token}),cache:'no-store'});saveSession(await parse(r));return session}
async function ensure(){session=readSession();if(!session?.access_token)throw new Error('Please sign in from the BIG BROTHER Dashboard.');if(session.expires_at&&Number(session.expires_at)<Math.floor(Date.now()/1000)+45)await refreshSession();return session}
async function rpc(fn,args={}){await ensure();let r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'});if(r.status===401){await refreshSession();r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'})}return parse(r)}
function setLoading(x,t='Loading…'){$('loadingText').textContent=t;$('loading').classList.toggle('hide',!x)}function badge(s){const x=String(s||'INFO').toUpperCase(),c=x==='CRITICAL'||x==='OVER_LIMIT'?'crit':x==='WARNING'||x==='OVERDUE'?'warn':x==='OK'?'ok':'info';return `<span class="pill ${c}">${esc(x)}</span>`}function fmtDate(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):d.toLocaleString()}
function modal(html){$('modalBody').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}window.closeModal=closeModal;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
const META={management:['Management Control Center','Live company overview across Sales, Cash, A/R, Purchase, Expenses and Stock.'],activity:['System Activity','Company-wide audit history · Admin only.'],credit:['Customer Credit Control','Live A/R risk, overdue monitoring and configurable customer credit rules.'],'stock-alerts':['Smart Stock Alerts','Low stock, expiry, damage, batch reconciliation and receiving alerts.'],notifications:['Notification Center','Your live BIG BROTHER alerts, filtered by your permissions and locations.']};
async function load(){const m=META[VIEW]||META.management;$('title').textContent=m[0];$('subtitle').textContent=m[1];setLoading(true,'Loading '+m[0]+'…');try{if(VIEW==='activity')await loadActivity();else if(VIEW==='credit')await loadCredit();else if(VIEW==='stock-alerts')await loadStock();else if(VIEW==='notifications')await loadNotifications();else await loadManagement()}catch(e){$('content').innerHTML=`<div class="errorbox"><strong>Could not open this function.</strong><div style="margin-top:6px">${esc(e.message||e)}</div></div>`}finally{setLoading(false)}}
async function loadManagement(){const old=lastData?.date||new Date().toISOString().slice(0,10),d=await rpc('bb_management_control_center',{p_date:old});lastData=d;const s=d.sales||{},c=d.collections||{},ar=d.receivable||{},ap=d.purchasePayable||{},ex=d.expenses||{},st=d.stock||{},p=d.pending||{},cc=d.creditControl||{};$('content').innerHTML=`<div class="toolbar"><label><strong>Date</strong> <input id="mgrDate" type="date" value="${esc(d.date||old)}"></label><button class="btn primary" id="mgrGo">Load Date</button></div><div class="cards"><div class="card stat"><span>Sales Today</span><strong>${money(s.USD)} · ${money(s.KHR,'KHR')}</strong><div class="section-note">${s.count||0} invoices</div></div><div class="card stat"><span>Collections Today</span><strong>${money(c.USD)} · ${money(c.KHR,'KHR')}</strong><div class="section-note">${c.count||0} payments</div></div><div class="card stat"><span>Accounts Receivable</span><strong>${money(ar.USD)} · ${money(ar.KHR,'KHR')}</strong><div class="section-note">Overdue ${money(ar.overdueUSD)} / ${money(ar.overdueKHR,'KHR')}</div></div><div class="card stat"><span>Purchase Payable</span><strong>${money(ap.USD)} · ${money(ap.KHR,'KHR')}</strong><div class="section-note">${ap.count||0} open</div></div><div class="card stat"><span>Stock Value</span><strong>${money(st.valueUSD)}</strong><div class="section-note">Good qty ${qty(st.totalGoodQty)} · ${st.openBatches||0} open batches</div></div></div><div class="cards"><div class="card stat"><span>Expenses This Month</span><strong>${money(ex.monthUSD)}</strong><div class="section-note">Unpaid equivalent ${money(ex.unpaidEquivalentUSD)}</div></div><div class="card stat"><span>Credit Risk</span><strong>${cc.riskCustomers||0}</strong><div class="section-note">${cc.blockedCustomers||0} blocked by configured rule</div></div><div class="card stat"><span>Stock Alerts</span><strong>${st.criticalAlerts||0} / ${st.warningAlerts||0}</strong><div class="section-note">Critical / Warning</div></div><div class="card stat"><span>Pending Approvals</span><strong>${(p.receivableRequests||0)+(p.dailyCash||0)+(p.deposits||0)}</strong><div class="section-note">A/R ${p.receivableRequests||0} · Cash ${p.dailyCash||0} · Deposit ${p.deposits||0}</div></div><div class="card stat"><span>Open Deliveries</span><strong>${p.deliveries||0}</strong><div class="section-note">Current non-terminal requests</div></div></div><div class="card"><div class="head"><strong>Location Performance</strong><span class="pill blue">${esc(d.date||'')}</span></div><div class="tablewrap"><table><thead><tr><th>Location</th><th class="money">Sales USD</th><th class="money">Sales KHR</th><th>Invoices</th><th class="money">Collection USD</th><th class="money">Collection KHR</th><th class="money">A/R USD</th><th class="money">A/R KHR</th></tr></thead><tbody>${(d.locations||[]).map(x=>`<tr><td><strong>${esc(x.locationCode)}</strong><div class="activity-meta">${esc(x.locationName)}</div></td><td class="money">${money(x.salesUSD)}</td><td class="money">${money(x.salesKHR,'KHR')}</td><td>${x.invoiceCount||0}</td><td class="money">${money(x.collectionUSD)}</td><td class="money">${money(x.collectionKHR,'KHR')}</td><td class="money">${money(x.receivableUSD)}</td><td class="money">${money(x.receivableKHR,'KHR')}</td></tr>`).join('')}</tbody></table></div></div>`;$('mgrGo').onclick=async()=>{lastData={date:$('mgrDate').value};await loadManagement()}}
async function loadActivity(){const search=lastData?.search||'',module=lastData?.module||'',d=await rpc('bb_system_activity',{p_limit:300,p_module:module||null,p_search:search||null});lastData={...d,search,module};const modules=[...new Set((d.rows||[]).map(x=>x.moduleKey).filter(Boolean))].sort();$('content').innerHTML=`<div class="cards"><div class="card stat"><span>Total Logged</span><strong>${d.total||0}</strong></div><div class="card stat"><span>Today</span><strong>${d.today||0}</strong></div></div><div class="card"><div class="body"><div class="toolbar"><input id="actSearch" placeholder="Search user / invoice / payment / action" value="${esc(search)}"><select id="actModule"><option value="">All modules</option>${modules.map(x=>`<option ${x===module?'selected':''}>${esc(x)}</option>`).join('')}</select><button id="actGo" class="btn primary">Search</button></div><div class="tablewrap"><table><thead><tr><th>Time</th><th>User</th><th>Module</th><th>Action</th><th>Entity</th><th>Location</th><th>Changed Fields</th></tr></thead><tbody>${(d.rows||[]).map(x=>`<tr><td class="nowrap">${fmtDate(x.createdAt)}</td><td><strong>${esc(x.actorName)}</strong><div class="activity-meta">${esc(x.actorStaffId||'')}</div></td><td>${esc(x.moduleKey)}</td><td>${badge(x.action)}</td><td><strong>${esc(x.entityId||'—')}</strong><div class="activity-meta">${esc(x.entityType)}</div></td><td>${esc(x.locationCode||'—')}</td><td>${esc((x.metadata?.changedFields||[]).join(', ')||'—')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No activity found.</td></tr>'}</tbody></table></div></div></div>`;$('actGo').onclick=async()=>{lastData={search:$('actSearch').value,module:$('actModule').value};await loadActivity()}}
async function loadCredit(){const search=lastData?.search||'',d=await rpc('bb_customer_credit_control_list',{p_search:search||null});lastData={...d,search};$('content').innerHTML=`<div class="cards"><div class="card stat"><span>Risk Customers</span><strong>${d.riskCount||0}</strong></div><div class="card stat"><span>Blocked</span><strong>${d.blockedCount||0}</strong></div><div class="card stat"><span>Overdue</span><strong>${d.overdueCount||0}</strong></div></div><div class="card"><div class="body"><div class="toolbar"><input id="crSearch" placeholder="Search customer / location" value="${esc(search)}"><button id="crGo" class="btn primary">Search</button></div><div class="section-note">Blocking is OFF unless you explicitly enable it for a customer.</div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Risk</th><th class="money">A/R USD</th><th class="money">Limit USD</th><th>USD Used</th><th class="money">A/R KHR</th><th class="money">Limit KHR</th><th>Overdue</th><th>Rule</th><th></th></tr></thead><tbody>${(d.rows||[]).map((x,i)=>`<tr><td><strong>${esc(x.customerName)}</strong><div class="activity-meta">${esc(x.customerId)} · ${esc(x.locationCode)}</div></td><td>${badge(x.riskStatus)}${x.blocked?' <span class="pill crit">BLOCKED</span>':''}</td><td class="money">${money(x.outstandingUSD)}</td><td class="money">${money(x.creditLimitUSD)}</td><td>${Number(x.usedPercentUSD||0).toFixed(1)}%</td><td class="money">${money(x.outstandingKHR,'KHR')}</td><td class="money">${money(x.creditLimitKHR,'KHR')}</td><td>${money(x.overdueUSD)}<br>${money(x.overdueKHR,'KHR')}</td><td>${x.configured?'Configured':'Monitor only'}</td><td><button class="btn ghost" onclick="editCredit(${i})">Edit</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">No customers found.</td></tr>'}</tbody></table></div></div></div>`;$('crGo').onclick=async()=>{lastData={search:$('crSearch').value};await loadCredit()}}
window.editCredit=i=>{const x=lastData.rows[i];modal(`<h2>Customer Credit Rule</h2><div class="sub">${esc(x.customerName)} · ${esc(x.customerId)} · ${esc(x.locationCode)}</div><div class="grid"><div class="field"><label>Credit Limit USD</label><input id="cUsd" type="number" min="0" step="0.01" value="${Number(x.creditLimitUSD||0)}"></div><div class="field"><label>Credit Limit KHR</label><input id="cKhr" type="number" min="0" step="1" value="${Number(x.creditLimitKHR||0)}"></div><div class="field"><label>Warning %</label><input id="cWarn" type="number" min="1" max="100" value="${Number(x.warningPercent||80)}"></div><div class="field"><label>Overdue Grace Days</label><input id="cGrace" type="number" min="0" max="365" value="${Number(x.graceDays||0)}"></div><label class="check"><input id="cBlockLimit" type="checkbox" ${x.blockOverLimit?'checked':''}> Block new credit when limit is exceeded</label><label class="check"><input id="cBlockOver" type="checkbox" ${x.blockOverdue?'checked':''}> Block new credit when overdue exists</label><label class="check"><input id="cActive" type="checkbox" ${x.active?'checked':''}> Rule active</label><div class="field full"><label>Note</label><textarea id="cNote">${esc(x.note||'')}</textarea></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button id="saveCredit" class="btn primary">Save Credit Rule</button></div>`);$('saveCredit').onclick=async()=>{setLoading(true,'Saving credit rule…');try{await rpc('bb_customer_credit_control_save',{p_payload:{customerId:x.customerId,creditLimitUSD:Number($('cUsd').value||0),creditLimitKHR:Number($('cKhr').value||0),warningPercent:Number($('cWarn').value||80),graceDays:Number($('cGrace').value||0),blockOverLimit:$('cBlockLimit').checked,blockOverdue:$('cBlockOver').checked,active:$('cActive').checked,note:$('cNote').value}});closeModal();await loadCredit()}catch(e){alert(e.message||e)}finally{setLoading(false)}}}
async function loadStock(){const d=await rpc('bb_stock_alerts');lastData=d;$('content').innerHTML=`<div class="cards"><div class="card stat"><span>Critical Alerts</span><strong>${d.criticalCount||0}</strong></div><div class="card stat"><span>Warnings</span><strong>${d.warningCount||0}</strong></div><div class="card stat"><span>Configured Thresholds</span><strong>${(d.settings||[]).length}</strong></div></div><div class="card"><div class="head"><strong>Live Stock Alerts</strong><button class="btn primary" onclick="newStockRule()">＋ Threshold</button></div><div>${(d.alerts||[]).map(x=>`<div class="alertrow"><div>${badge(x.severity)}</div><div><div class="alert-title">${esc(x.title)}</div><div class="alert-msg">${esc(x.message)} ${x.locationCode?'· '+esc(x.locationCode):''}</div></div><div class="activity-meta">${esc(x.type)}</div></div>`).join('')||'<div class="empty">No stock alerts right now.</div>'}</div></div><div class="card" style="margin-top:14px"><div class="head"><strong>Alert Threshold Settings</strong></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Location</th><th>Minimum Qty</th><th>Expiry Warning</th><th>Damage 7-Day Threshold</th><th>Status</th><th></th></tr></thead><tbody>${(d.settings||[]).map((x,i)=>`<tr><td><strong>${esc(x.productName)}</strong><div class="activity-meta">${esc(x.productCode)}</div></td><td>${esc(x.locationCode)}<div class="activity-meta">${esc(x.locationName)}</div></td><td>${qty(x.minStockQty)} ${esc(x.unit)}</td><td>${x.expiryWarningDays} days</td><td>${qty(x.damageWarningQty)} ${esc(x.unit)}</td><td>${x.active?badge('OK'):badge('OFF')}</td><td><button class="btn ghost" onclick="editStockRule(${i})">Edit</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No thresholds configured yet. Add one to start low-stock/damage/expiry monitoring.</td></tr>'}</tbody></table></div></div>`}
function stockModal(x={}){const products=lastData.products||[],locs=lastData.locations||[];modal(`<h2>${x.productCode?'Edit':'Add'} Stock Alert Threshold</h2><div class="grid"><div class="field"><label>Product</label><select id="sProd" ${x.productCode?'disabled':''}>${products.map(p=>`<option value="${esc(p.productCode)}" ${p.productCode===x.productCode?'selected':''}>${esc(p.productName)} — ${esc(p.productCode)}</option>`).join('')}</select></div><div class="field"><label>Location</label><select id="sLoc" ${x.locationCode?'disabled':''}>${locs.map(l=>`<option value="${esc(l.locationCode)}" ${l.locationCode===x.locationCode?'selected':''}>${esc(l.locationCode)} — ${esc(l.locationName)}</option>`).join('')}</select></div><div class="field"><label>Minimum Good Stock Qty</label><input id="sMin" type="number" min="0" step="0.001" value="${Number(x.minStockQty||0)}"></div><div class="field"><label>Expiry Warning Days</label><input id="sExp" type="number" min="0" max="365" value="${Number(x.expiryWarningDays??14)}"></div><div class="field"><label>Damage Qty Alert (7 Days)</label><input id="sDmg" type="number" min="0" step="0.001" value="${Number(x.damageWarningQty||0)}"></div><label class="check"><input id="sActive" type="checkbox" ${x.active!==false?'checked':''}> Alert rule active</label></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button id="saveStock" class="btn primary">Save Threshold</button></div>`);$('saveStock').onclick=async()=>{setLoading(true,'Saving stock threshold…');try{await rpc('bb_stock_alert_setting_save',{p_payload:{productCode:x.productCode||$('sProd').value,locationCode:x.locationCode||$('sLoc').value,minStockQty:Number($('sMin').value||0),expiryWarningDays:Number($('sExp').value||14),damageWarningQty:Number($('sDmg').value||0),active:$('sActive').checked}});closeModal();await loadStock()}catch(e){alert(e.message||e)}finally{setLoading(false)}}}
window.newStockRule=()=>stockModal({});window.editStockRule=i=>stockModal(lastData.settings[i]);
async function loadNotifications(){const d=await rpc('bb_notification_center');lastData=d;$('content').innerHTML=`<div class="cards"><div class="card stat"><span>Unread</span><strong>${d.unreadCount||0}</strong></div><div class="card stat"><span>Active Notifications</span><strong>${d.totalCount||0}</strong></div></div><div class="card"><div class="head"><strong>Live Notifications</strong><span class="pill blue">Auto-clears when business condition is resolved</span></div><div>${(d.notifications||[]).map((x,i)=>`<div class="alertrow notif ${x.read?'':'unread'}"><div>${badge(x.severity)}</div><div><div class="alert-title">${x.read?'':'● '}${esc(x.title)}</div><div class="alert-msg">${esc(x.message)}${x.locationCode?' · '+esc(x.locationCode):''}</div><div class="activity-meta">${esc(x.category)} · ${fmtDate(x.eventAt)}</div></div><div class="actions">${x.route?`<button class="btn ghost" onclick="openRoute('${esc(x.route)}','${esc(x.notificationKey)}')">Open</button>`:''}<button class="btn ghost" onclick="markNotif('${esc(x.notificationKey)}','${x.read?'unread':'read'}')">${x.read?'Unread':'Read'}</button><button class="btn danger" onclick="markNotif('${esc(x.notificationKey)}','dismiss')">Dismiss</button></div></div>`).join('')||'<div class="empty">No active notifications. 🎉</div>'}</div></div>`}
window.markNotif=async(k,a)=>{setLoading(true,'Updating notification…');try{await rpc('bb_notification_mark',{p_notification_key:k,p_action:a});await loadNotifications()}catch(e){alert(e.message||e)}finally{setLoading(false)}};window.openRoute=async(r,k)=>{try{await rpc('bb_notification_mark',{p_notification_key:k,p_action:'read'})}catch(_){}try{if(parent&&typeof parent.loadWorkspace==='function'){parent.loadWorkspace(r);return}}catch(_){}location.href='https://angsokhey11-cloud.github.io/big-brother-dashboard/?module='+encodeURIComponent(r)+'&autoload=1'};
$('refreshBtn').onclick=load;load();
