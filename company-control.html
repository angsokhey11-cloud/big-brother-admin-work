<script>
'use strict';
const SB_URL='https://sjfhlaclgmkwwofzstok.supabase.co',SB_KEY='sb_publishable_w762jR65CWwlO30fKQsYOw_6L9grx8S',SESSION_KEY='BB_SUPABASE_DEV_SESSION_V1';
const VIEW=(new URLSearchParams(location.search).get('view')||'management').toLowerCase();let session=null,lastData=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=(v,c='USD')=>String(c).toUpperCase()==='KHR'?'៛'+Number(v||0).toLocaleString(undefined,{maximumFractionDigits:0}):'$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const qty=v=>Number(v||0).toLocaleString(undefined,{maximumFractionDigits:3});
function readSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(_){return null}}function saveSession(s){session=s||null;try{if(!s)localStorage.removeItem(SESSION_KEY);else{if(!s.expires_at&&s.expires_in)s.expires_at=Math.floor(Date.now()/1000)+Number(s.expires_in);localStorage.setItem(SESSION_KEY,JSON.stringify(s))}}catch(_){}}
async function parse(r){const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(_){d={message:t}}if(!r.ok)throw new Error(d.message||d.msg||d.error_description||d.error||d.error_code||('Request failed '+r.status));return d}

let bbSessionRefreshInFlight=null;
async function refreshSession(){
  if(bbSessionRefreshInFlight)return bbSessionRefreshInFlight;
  const rotate=async()=>{
    // Other BIG BROTHER views share this origin and may have renewed the session already.
    const current=readSession();
    if(!current?.refresh_token)throw new Error('Please sign in to BIG BROTHER again.');
    const now=Math.floor(Date.now()/1000);
    if(Number(current.expires_at||0)>now+60){session=current;return current;}
    const response=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:current.refresh_token}),cache:'no-store'
    });
    if(!response.ok){
      let detail={};try{detail=await response.json()}catch(_){}
      const newest=readSession();
      if(newest?.access_token&&newest.refresh_token!==current.refresh_token&&
         Number(newest.expires_at||0)>Math.floor(Date.now()/1000)+30){
        session=newest;return newest;
      }
      const code=String(detail.error_code||detail.code||'');
      if(code==='refresh_token_not_found'||code==='refresh_token_already_used'||
         String(detail.msg||'').toLowerCase().includes('refresh token')){
        throw new Error('Your sign-in session has expired. Please return to BIG BROTHER Dashboard and sign in again.');
      }
      throw new Error(detail.message||detail.msg||detail.error_description||detail.error||('Session refresh failed ('+response.status+')'));
    }
    const next=await parse(response);saveSession(next);return next;
  };
  // Web Locks serializes rotation between same-origin open tabs/iframes (where supported).
  const work=()=>navigator.locks?.request
    ? navigator.locks.request('BB_SUPABASE_DEV_SESSION_REFRESH_V1',rotate)
    : rotate();
  bbSessionRefreshInFlight=work();
  try{return await bbSessionRefreshInFlight}
  finally{bbSessionRefreshInFlight=null}
}
async function ensure(){session=readSession();if(!session?.access_token)throw new Error('Please sign in from the BIG BROTHER Dashboard.');if(session.expires_at&&Number(session.expires_at)<Math.floor(Date.now()/1000)+45)await refreshSession();session=readSession()||session;return session}
async function rpc(fn,args={}){await ensure();let r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'});if(r.status===401){await refreshSession();session=readSession()||session;r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'})}return parse(r)}
function setLoading(x,t='Loading…'){$('loadingText').textContent=t;$('loading').classList.toggle('hide',!x)}function badge(s){const x=String(s||'INFO').toUpperCase(),c=x==='CRITICAL'||x==='OVER_LIMIT'?'crit':x==='WARNING'||x==='OVERDUE'?'warn':x==='OK'?'ok':'info';return `<span class="pill ${c}">${esc(x)}</span>`}function fmtDate(v){if(!v)return'—';const d=new Date(v);if(Number.isNaN(d.getTime()))return esc(v);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Phnom_Penh'}).replace(/ /g,'-')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Phnom_Penh'})}
function modal(html){$('modalBody').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}window.closeModal=closeModal;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
const META={management:['Management Control Center','Live company overview across Sales, Cash, A/R, Purchase, Expenses and Stock.'],activity:['System Activity','Company-wide audit history · Admin only.'],credit:['Customer Credit Control','Live A/R risk, overdue monitoring and configurable customer credit rules.'],'stock-alerts':['Smart Stock Alerts','Low stock, expiry, damage, batch reconciliation and receiving alerts.'],notifications:['មជ្ឈមណ្ឌលជូនដំណឹង · Notification Center','ការជូនដំណឹងអំពីការងារ និងបំណុល · ផ្ទុកឡើងវិញពេលត្រូវការ']};
async function load(){const m=META[VIEW]||META.management;$('title').textContent=m[0];$('subtitle').textContent=m[1];setLoading(true,'Loading '+m[0]+'…');try{if(VIEW==='activity')await loadActivity();else if(VIEW==='credit')await loadCredit();else if(VIEW==='stock-alerts')await loadStock();else if(VIEW==='notifications')await loadNotifications();else await loadManagement()}catch(e){$('content').innerHTML=`<div class="errorbox"><strong>Could not open this function.</strong><div style="margin-top:6px">${esc(e.message||e)}</div></div>`}finally{setLoading(false)}}
async function loadManagement(){const old=lastData?.date||new Date().toISOString().slice(0,10),d=await rpc('bb_management_control_center',{p_date:old});lastData=d;const s=d.sales||{},c=d.collections||{},ar=d.receivable||{},ap=d.purchasePayable||{},ex=d.expenses||{},st=d.stock||{},p=d.pending||{},cc=d.creditControl||{};$('content').innerHTML=`<div class="toolbar"><label><strong>Date</strong> <input id="mgrDate" type="date" value="${esc(d.date||old)}"></label><button class="btn primary" id="mgrGo">Load Date</button></div><div class="cards"><div class="card stat"><span>Sales Today</span><strong>${money(s.USD)} · ${money(s.KHR,'KHR')}</strong><div class="section-note">${s.count||0} invoices</div></div><div class="card stat"><span>Collections Today</span><strong>${money(c.USD)} · ${money(c.KHR,'KHR')}</strong><div class="section-note">${c.count||0} payments</div></div><div class="card stat"><span>Accounts Receivable</span><strong>${money(ar.USD)} · ${money(ar.KHR,'KHR')}</strong><div class="section-note">Overdue ${money(ar.overdueUSD)} / ${money(ar.overdueKHR,'KHR')}</div></div><div class="card stat"><span>Purchase Payable</span><strong>${money(ap.USD)} · ${money(ap.KHR,'KHR')}</strong><div class="section-note">${ap.count||0} open</div></div><div class="card stat"><span>Stock Value</span><strong>${money(st.valueUSD)}</strong><div class="section-note">Good qty ${qty(st.totalGoodQty)} · ${st.openBatches||0} open batches</div></div></div><div class="cards"><div class="card stat"><span>Expenses This Month</span><strong>${money(ex.monthUSD)}</strong><div class="section-note">Unpaid equivalent ${money(ex.unpaidEquivalentUSD)}</div></div><div class="card stat"><span>Credit Risk</span><strong>${cc.riskCustomers||0}</strong><div class="section-note">${cc.blockedCustomers||0} blocked by configured rule</div></div><div class="card stat"><span>Stock Alerts</span><strong>${st.criticalAlerts||0} / ${st.warningAlerts||0}</strong><div class="section-note">Critical / Warning</div></div><div class="card stat"><span>Pending Approvals</span><strong>${(p.receivableRequests||0)+(p.dailyCash||0)+(p.deposits||0)}</strong><div class="section-note">A/R ${p.receivableRequests||0} · Cash ${p.dailyCash||0} · Deposit ${p.deposits||0}</div></div><div class="card stat"><span>Open Deliveries</span><strong>${p.deliveries||0}</strong><div class="section-note">Current non-terminal requests</div></div></div><div class="card"><div class="head"><strong>Location Performance</strong><span class="pill blue">${esc(d.date?fmtDate(d.date).split(' ')[0]:'')}</span></div><div class="tablewrap"><table><thead><tr><th>Location</th><th class="money">Sales USD</th><th class="money">Sales KHR</th><th>Invoices</th><th class="money">Collection USD</th><th class="money">Collection KHR</th><th class="money">A/R USD</th><th class="money">A/R KHR</th></tr></thead><tbody>${(d.locations||[]).map(x=>`<tr><td><strong>${esc(x.locationCode)}</strong><div class="activity-meta">${esc(x.locationName)}</div></td><td class="money">${money(x.salesUSD)}</td><td class="money">${money(x.salesKHR,'KHR')}</td><td>${x.invoiceCount||0}</td><td class="money">${money(x.collectionUSD)}</td><td class="money">${money(x.collectionKHR,'KHR')}</td><td class="money">${money(x.receivableUSD)}</td><td class="money">${money(x.receivableKHR,'KHR')}</td></tr>`).join('')}</tbody></table></div></div>`;$('mgrGo').onclick=async()=>{lastData={date:$('mgrDate').value};await loadManagement()}}
async function loadActivity(){const search=lastData?.search||'',module=lastData?.module||'',d=await rpc('bb_system_activity',{p_limit:300,p_module:module||null,p_search:search||null});lastData={...d,search,module};const modules=[...new Set((d.rows||[]).map(x=>x.moduleKey).filter(Boolean))].sort();$('content').innerHTML=`<div class="cards"><div class="card stat"><span>Total Logged</span><strong>${d.total||0}</strong></div><div class="card stat"><span>Today</span><strong>${d.today||0}</strong></div></div><div class="card"><div class="body"><div class="toolbar"><input id="actSearch" placeholder="Search user / invoice / payment / action" value="${esc(search)}"><select id="actModule"><option value="">All modules</option>${modules.map(x=>`<option ${x===module?'selected':''}>${esc(x)}</option>`).join('')}</select><button id="actGo" class="btn primary">Search</button></div><div class="tablewrap"><table><thead><tr><th>Time</th><th>User</th><th>Module</th><th>Action</th><th>Entity</th><th>Location</th><th>Changed Fields</th></tr></thead><tbody>${(d.rows||[]).map(x=>`<tr><td class="nowrap">${fmtDate(x.createdAt)}</td><td><strong>${esc(x.actorName)}</strong><div class="activity-meta">${esc(x.actorStaffId||'')}</div></td><td>${esc(x.moduleKey)}</td><td>${badge(x.action)}</td><td><strong>${esc(x.entityId||'—')}</strong><div class="activity-meta">${esc(x.entityType)}</div></td><td>${esc(x.locationCode||'—')}</td><td>${esc((x.metadata?.changedFields||[]).join(', ')||'—')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No activity found.</td></tr>'}</tbody></table></div></div></div>`;$('actGo').onclick=async()=>{lastData={search:$('actSearch').value,module:$('actModule').value};await loadActivity()}}
async function loadCredit(){const search=lastData?.search||'',d=await rpc('bb_customer_credit_control_list',{p_search:search||null});lastData={...d,search};$('content').innerHTML=`<div class="cards"><div class="card stat"><span>Risk Customers</span><strong>${d.riskCount||0}</strong></div><div class="card stat"><span>Blocked</span><strong>${d.blockedCount||0}</strong></div><div class="card stat"><span>Overdue</span><strong>${d.overdueCount||0}</strong></div></div><div class="card"><div class="body"><div class="toolbar"><input id="crSearch" placeholder="Search customer / location" value="${esc(search)}"><button id="crGo" class="btn primary">Search</button></div><div class="section-note">Blocking is OFF unless you explicitly enable it for a customer.</div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Risk</th><th class="money">A/R USD</th><th class="money">Limit USD</th><th>USD Used</th><th class="money">A/R KHR</th><th class="money">Limit KHR</th><th>Overdue</th><th>Rule</th><th></th></tr></thead><tbody>${(d.rows||[]).map((x,i)=>`<tr><td><strong>${esc(x.customerName)}</strong><div class="activity-meta">${esc(x.customerId)} · ${esc(x.locationCode)}</div></td><td>${badge(x.riskStatus)}${x.blocked?' <span class="pill crit">BLOCKED</span>':''}</td><td class="money">${money(x.outstandingUSD)}</td><td class="money">${money(x.creditLimitUSD)}</td><td>${Number(x.usedPercentUSD||0).toFixed(1)}%</td><td class="money">${money(x.outstandingKHR,'KHR')}</td><td class="money">${money(x.creditLimitKHR,'KHR')}</td><td>${money(x.overdueUSD)}<br>${money(x.overdueKHR,'KHR')}</td><td>${x.configured?'Configured':'Monitor only'}</td><td><button class="btn ghost" onclick="editCredit(${i})">Edit</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">No customers found.</td></tr>'}</tbody></table></div></div></div>`;$('crGo').onclick=async()=>{lastData={search:$('crSearch').value};await loadCredit()}}
window.editCredit=i=>{const x=lastData.rows[i];modal(`<h2>Customer Credit Rule</h2><div class="sub">${esc(x.customerName)} · ${esc(x.customerId)} · ${esc(x.locationCode)}</div><div class="grid"><div class="field"><label>Credit Limit USD</label><input id="cUsd" type="number" min="0" step="0.01" value="${Number(x.creditLimitUSD||0)}"></div><div class="field"><label>Credit Limit KHR</label><input id="cKhr" type="number" min="0" step="1" value="${Number(x.creditLimitKHR||0)}"></div><div class="field"><label>Warning %</label><input id="cWarn" type="number" min="1" max="100" value="${Number(x.warningPercent||80)}"></div><div class="field"><label>Overdue Grace Days</label><input id="cGrace" type="number" min="0" max="365" value="${Number(x.graceDays||0)}"></div><label class="check"><input id="cBlockLimit" type="checkbox" ${x.blockOverLimit?'checked':''}> Block new credit when limit is exceeded</label><label class="check"><input id="cBlockOver" type="checkbox" ${x.blockOverdue?'checked':''}> Block new credit when overdue exists</label><label class="check"><input id="cActive" type="checkbox" ${x.active?'checked':''}> Rule active</label><div class="field full"><label>Note</label><textarea id="cNote">${esc(x.note||'')}</textarea></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button id="saveCredit" class="btn primary">Save Credit Rule</button></div>`);$('saveCredit').onclick=async()=>{setLoading(true,'Saving credit rule…');try{await rpc('bb_customer_credit_control_save',{p_payload:{customerId:x.customerId,creditLimitUSD:Number($('cUsd').value||0),creditLimitKHR:Number($('cKhr').value||0),warningPercent:Number($('cWarn').value||80),graceDays:Number($('cGrace').value||0),blockOverLimit:$('cBlockLimit').checked,blockOverdue:$('cBlockOver').checked,active:$('cActive').checked,note:$('cNote').value}});closeModal();await loadCredit()}catch(e){alert(e.message||e)}finally{setLoading(false)}}}

function bbInboxTime(item){
 if(String(item.notificationKey||'').startsWith('OVERDUE-CUSTOMER:'))return 'បច្ចុប្បន្ន';
 const date=new Date(item.eventAt);
 if(!Number.isFinite(date.getTime()))return '';
 const minutes=Math.max(0,Math.floor((Date.now()-date.getTime())/60000));
 if(minutes<1)return 'ទើបតែឥឡូវ';
 if(minutes<60)return minutes+' នាទីមុន';
 if(minutes<1440)return Math.floor(minutes/60)+' ម៉ោងមុន';
 if(minutes<2880)return 'ម្សិលមិញ';
 return date.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Phnom_Penh'}).replace(/ /g,'-');
}
function bbInboxDetails(item){

 if(receivableSummary){
   const m=text.match(/^(.*?)\s*·\s*USD\s*([\d,.]+)\s*·\s*KHR\s*([\d,.]+)\s*·\s*(\d+)\s+invoices?$/i);
   return {
     title:receivableMode==='Overdue Only'?'រំលឹកបំណុលផុតកំណត់':'បំណុលមិនទាន់ទូទាត់',
     description:m?m[1]+' · '+m[4]+' វិក្កយបត្រមិនទាន់ទូទាត់':text,
     metrics:m?'USD '+m[2]+' · KHR '+m[3]:'',
     tag:receivableMode==='Overdue Only'?'ផុតកំណត់':'មិនទាន់ទូទាត់',
     tagTone:receivableMode==='Overdue Only'?'alert':'',
     urgent:receivableMode==='Overdue Only',time:'បច្ចុប្បន្ន'
   };
 }
 if(String(item.notificationKey||'').startsWith('AR-OVERDUE:')){
   const found=text.match(/^បំណុលផុតកំណត់ថ្មី៖\s*(.*?)\s*·\s*(\d+)\s+វិក្កយបត្រ(?:\s*·\s*(.*))?$/);
   return {title:'បំណុលផុតកំណត់ថ្មី',description:found?found[1]+' · '+found[2]+' វិក្កយបត្រផុតកំណត់':text,
     metrics:found?found[3]||'':'',tag:'ថ្មី · ផុតកំណត់',tagTone:'alert',urgent:true,time:bbInboxTime(item)};
 }
 const eventKh=[
  [/^A\/R approval requested/i,'ស្នើអនុម័តការទូទាត់បំណុល'],

  [/^A\/R request rejected/i,'សំណើបំណុលត្រូវបានបដិសេធ'],
  [/^Daily Cash approval requested/i,'ស្នើអនុម័តសាច់ប្រាក់ប្រចាំថ្ងៃ'],
  [/^Staff payment request/i,'សំណើបើកប្រាក់បុគ្គលិក'],
  [/^Staff payment approved/i,'ការបើកប្រាក់បុគ្គលិកបានអនុម័ត'],

  [/^Staff payment paid/i,'បានបើកប្រាក់បុគ្គលិក'],

  [/^Earnings paid/i,'បានបើកប្រាក់ចំណូលបុគ្គលិក'],
  [/^Stock In/i,'ទំនិញចូល'],
  [/^Stock Out/i,'ទំនិញចេញ'],
  [/^Stock Transfer/i,'ផ្ទេរទំនិញ'],
  [/^Stock assigned/i,'បានបែងចែកស្តុក'],
  [/^Bank In/i,'ទទួលប្រាក់តាមធនាគារ'],

 ];
 let localized=text;
 for(const [pattern,label] of eventKh)if(pattern.test(localized)){localized=localized.replace(pattern,label);break}

 return {title:localized,description:'',metrics:'',

function bbInboxActionLabel(item){
 const route=String(item.route||'');
 if(route==='bank-register')return 'ភ្ជាប់មុខងារមិនទាន់រួច';
 if(item.category==='Receivable')return 'មើលបំណុល';
 if(item.category==='Approvals')return /approved|completed|rejected/i.test(String(item.title||''))?'មើលការអនុម័ត':'ពិនិត្យសំណើ';
 if(item.category==='Requests')return /approved|completed|rejected/i.test(String(item.title||''))?'មើលសំណើ':'ពិនិត្យសំណើ';
 if(item.category==='Stock')return /batch|stock/i.test(route)?'មើលស្តុក':'មើលព័ត៌មាន';
 if(item.category==='Schedule')return 'មើលកាលវិភាគ';
 if(item.category==='Payments'||item.category==='Cash & Bank')return 'មើលការទូទាត់';
 return 'មើលព័ត៌មាន';
}
function bbInboxFiltered(items){
 const now=new Date();
 const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Phnom_Penh',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
 return items.filter(x=>{
   if(bbInboxRead==='unread'&&x.read)return false;
   if(bbInboxRead==='read'&&!x.read)return false;
   if(bbInboxDate==='all')return true;
   // Outstanding customer balances are live summaries, NOT events dated today.
   if(String(x.notificationKey||'').startsWith('OVERDUE-CUSTOMER:'))return false;
   const d=new Date(x.eventAt);
   if(!Number.isFinite(d.getTime()))return false;
   if(bbInboxDate==='today')return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Phnom_Penh',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)===today;
   return bbInboxDate==='week'&&d.getTime()>=Date.now()-7*86400000;
 }).sort((a,b)=>{
   // All is an activity inbox: show real events before current outstanding
   // customer summaries, which are snapshots rather than timed events.
   // Never discard a receivable or change its read state.
   if(notificationCategory==='All'){
     const sa=String(a.notificationKey||'').startsWith('OVERDUE-CUSTOMER:');
     const sb=String(b.notificationKey||'').startsWith('OVERDUE-CUSTOMER:');
     if(sa!==sb)return sa?1:-1;
   }
   return new Date(b.eventAt).getTime()-new Date(a.eventAt).getTime();
 });
}

        '<option value="all">គ្រប់ស្ថានភាព</option><option value="unread">មិនទាន់អាន</option><option value="read">បានអាន</option></select></label>'+
      (notificationCategory==='Receivable'?
        '<label>'+bbInboxSvg('receivable-one',true)+'<select id="bbReceivableMode" aria-label="Receivable scope">'+
          '<option value="Overdue Only">ផុតកំណត់</option><option value="All Outstanding">បំណុលទាំងអស់</option></select></label>':'')+
    '</div></div>'+
  '<div class="bb-inbox-list">'+
    '<div class="bb-inbox-list-head"><div><strong>'+unread.length+' មិនទាន់អាន</strong>'+
       '<small>បង្ហាញ '+visible.length+' · '+esc(bbInboxCategoryKh[notificationCategory]||notificationCategory)+' · ចុចផ្ទុកឡើងវិញដើម្បីធ្វើបច្ចុប្បន្នភាព</small></div>'+
       '<button type="button" id="bbInboxMarkAll" class="bb-inbox-mark-all" '+(unread.length?'':'disabled')+'>'+
         bbInboxSvg('circle-check',true)+'សម្គាល់ថាបានអាន</button></div>'+
    (visible.length?visible.map((item,i)=>{
      const detail=bbInboxDetails(item),category=String(item.category||'Notice');
      const tone=bbInboxTones[category]||'blue';
      const icon=bbInboxIconByCategory[category]||'bell';
      return '<article class="bb-inbox-item '+(item.read?'':'unread ')+(detail.urgent?'bb-inbox-urgent':'')+'">'+
        '<button type="button" class="bb-inbox-main" data-open="'+i+'" aria-label="Open '+esc(category)+' notification: '+esc(detail.title)+'">'+
          '<span class="bb-inbox-icon-box '+tone+'">'+bbInboxSvg(icon)+'</span>'+
          '<span class="bb-inbox-content">'+
            '<span class="bb-inbox-title-line">'+(!item.read?'<span class="bb-inbox-dot" aria-label="Unread"></span>':'')+
               '<span class="bb-inbox-title">'+esc(detail.title)+'</span>'+
               '<span class="bb-inbox-time">'+esc(detail.time)+'</span></span>'+
            (detail.description?'<span class="bb-inbox-desc">'+esc(detail.description)+'</span>':'')+
            (detail.metrics?'<span class="bb-inbox-metrics">'+esc(detail.metrics)+'</span>':'')+
          '</span></button>'+
        '<div class="bb-inbox-bottom"><div class="bb-inbox-tags">'+
           '<span class="bb-inbox-tag">'+esc(bbInboxCategoryKh[category]||category)+'</span>'+
           (detail.tag?'<span class="bb-inbox-tag '+detail.tagTone+'">'+esc(detail.tag)+'</span>':'')+
          '</div><button type="button" class="bb-inbox-action" data-open="'+i+'">'+
             esc(bbInboxActionLabel(item))+'</button></div></article>';
    }).join(''):'<div class="bb-inbox-empty">'+bbInboxSvg('bell')+'មិនមានការជូនដំណឹងត្រូវនឹងការច្រោះនេះទេ</div>')+
    '</div>';
 $('bbInboxDate').value=bbInboxDate;
 $('bbInboxRead').value=bbInboxRead;
 $('bbInboxDate').onchange=e=>{bbInboxDate=e.target.value;bbInboxRender()};
 $('bbInboxRead').onchange=e=>{bbInboxRead=e.target.value;bbInboxRender()};
 const mode=$('bbReceivableMode');
 if(mode){mode.value=receivableMode;mode.onchange=()=>{
   receivableMode=mode.value;
   loadNotifications().catch(e=>alert(e.message||e));
 }}
 $('bbNotifTabs').onclick=e=>{
   const btn=e.target.closest('[data-cat]');if(!btn||bbInboxLoading)return;
   if(btn.dataset.cat===notificationCategory)return;
   const before=notificationCategory;
   notificationCategory=btn.dataset.cat;
   if(notificationCategory==='Receivable')bbInboxRead='unread';
   else if(before==='Receivable')bbInboxRead='all';
   loadNotifications().catch(err=>alert(err.message||err));
 };
 $('content').querySelector('.bb-inbox-list').onclick=e=>{
   const btn=e.target.closest('button[data-open]');
   if(!btn)return;
   openNotification(visible[Number(btn.dataset.open)]).catch(err=>alert(err.message||err));
 };
 $('bbInboxMarkAll').onclick=()=>bbInboxMarkVisible(unread);
}
async function bbInboxMarkVisible(selected){
 if(bbInboxMarking||!selected.length)return;
 bbInboxMarking=true;
 const button=$('bbInboxMarkAll');
 if(button){button.disabled=true;button.textContent='កំពុងសម្គាល់…';}
 try{
   const keys=selected.map(x=>x.notificationKey);
   await rpc('bb_notification_mark_visible_v1',{p_keys:keys,p_category:notificationCategory});
   const marked=new Set(keys);
   (lastData?.notifications||[]).forEach(item=>{
     if(marked.has(item.notificationKey))item.read=true;
   });
   (bbInboxAllSnapshot?.notifications||[]).forEach(item=>{
     if(marked.has(item.notificationKey))item.read=true;
   });
   bbInboxRender();
 }catch(error){alert(error.message||error);bbInboxRender()}
 finally{bbInboxMarking=false}
}
async function loadNotifications(){
 if(bbInboxLoading)return;
 bbInboxLoading=true;
 document.body.classList.add('bb-inbox-page');
 try{
  const d=await rpc('bb_notification_v2_feed',{p_category:notificationCategory,p_receivable_view:receivableMode});
  lastData=d;
  if(notificationCategory==='All')bbInboxAllSnapshot=d;
  const p=document.querySelector('.actions .pill.ok');
  if(p&&p.dataset.bbInbox!=='1'){
    p.dataset.bbInbox='1';
    p.innerHTML=bbInboxSvg('shield-check',true)+' ការពារដោយ Supabase';
  }
  const refresh=$('refreshBtn');if(refresh&&refresh.dataset.bbInbox!=='1'){
    refresh.dataset.bbInbox='1';
    refresh.innerHTML=bbInboxSvg('rotate-ccw',true)+' ផ្ទុកឡើងវិញ';
    refresh.style.display='inline-flex';
    refresh.style.gap='6px';
    refresh.style.alignItems='center';
  }
  bbInboxRender();
 }finally{bbInboxLoading=false}
}

async function openNotification(item){
  if(!item)return;
  // This legacy bank event does not have a registered dashboard route.
  // Do not push staff into a blank page or silently mark it handled.
  if(item.route==='bank-register'){
    modal('<h2>មុខងារភ្ជាប់មិនទាន់រួច</h2>'+
      '<p>ការជូនដំណឹងធនាគារនេះមិនទាន់មានតំណភ្ជាប់ទៅកាន់ប្រតិបត្តិការពិតក្នុង BIG BROTHER ទេ។</p>'+
      '<p>Bank Register notification links will be connected after the exact target screen is confirmed.</p>'+
      '<div class="modal-actions"><button type="button" class="btn primary" onclick="closeModal()">បិទ</button></div>');
    return;
  }
  try{await rpc('bb_notification_mark',{p_notification_key:item.notificationKey,p_action:'read'})}catch(_){};
  // A/R customer summaries carry exact customer IDs, not ambiguous names.
  // The target is one-use and short-lived; the A/R module checks ownership.
  try{
    sessionStorage.setItem('BB_NOTIFICATION_TARGET_V2',JSON.stringify({
      route:item.route,entityId:item.entityId,notificationKey:item.notificationKey
    }));
    if(item.category==='Receivable' &&
       (String(item.notificationKey||'').startsWith('OVERDUE-CUSTOMER:')||
        String(item.notificationKey||'').startsWith('AR-OVERDUE:')) &&
       (item.route==='ar-your'||item.route==='ar-all') &&
       String(item.entityId||'').trim()){
      sessionStorage.setItem('BB_NOTIFICATION_AR_FOCUS_V1',JSON.stringify({
        route:item.route,customerId:String(item.entityId).trim(),
        view:receivableMode,createdAt:Date.now()
      }));
    }else{
      sessionStorage.removeItem('BB_NOTIFICATION_AR_FOCUS_V1');
    }
  }catch(_){}
  // Mobile uses its native module router; desktop retains its current routing.
  try{
    if(parent&&typeof parent.BBMobileOpenNotificationV1==='function' &&
       parent.BBMobileOpenNotificationV1(item.route)!==false)return;
  }catch(_){}
  try{if(parent&&typeof parent.loadWorkspace==='function'){parent.loadWorkspace(item.route);return}}catch(_){}
  window.top.location.href='https://angsokhey11-cloud.github.io/big-brother-dashboard/?module='+encodeURIComponent(item.route)+'&autoload=1';
}

$('refreshBtn').onclick=load;load();
</script>
