<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Admin Work Supabase</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Admin Work…<div class="bb-sub">Supabase Auth · secure approvals</div></div></div>
<script>
(async function(){
  try{
    const response=await fetch('legacy-google-v6.5.html?v=20260910-1',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Admin Work source.');
    let html=await response.text();

    const adapter='<scr'+'ipt src="supabase-admin-work-adapter.js?v=20260910-1"></scr'+'ipt>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Admin Work source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+html.slice(headClose);

    const marker='restoreAccess();';
    const replacement=`// SUPABASE AUTH CUTOVER\napiPost=window.BBAdminWorkAdapter.apiPost;\napiGet=window.BBAdminWorkAdapter.apiGet;\nsessionToken='';\ndeviceToken='';\n\nlogout=async function(){\n  await window.BBAdminWorkAdapter.signOut();\n  location.reload();\n};\n\nloadVaultReport=async function(force=true){\n  try{\n    const rate=Number($("vaultReportRate").value||0);\n    const d=await apiGet({action:'vaultReport',currentRate:rate});\n    if(!d||(!d.ok&&!d.success))throw new Error(d?.error||'Could not load Vault Report');\n    vaultReportData=d;\n    renderVaultReport();\n    vaultReportCacheSave();\n  }catch(e){\n    if(force||!vaultReportData)alert('Vault Report: '+(e?.message||e));\n  }\n};\n\n(async function(){\n  const needsSecureLoad=configureView();\n  if(!needsSecureLoad)return;\n  try{\n    await window.BBAdminWorkAdapter.ensureSession();\n    const profile=await window.BBAdminWorkAdapter.accessProfile();\n    sessionToken='SUPABASE_AUTH';\n    deviceToken='';\n    try{\n      sessionStorage.removeItem(SESSION_KEY);\n      localStorage.removeItem(DEVICE_KEY);\n      localStorage.removeItem(DEVICE_KEY+'_saved_at');\n    }catch(_){}\n    const label=profile?.staff?.staffName||profile?.user?.email||'Admin';\n    $("accessPill").textContent='🛡️ '+label;\n    $("loginOverlay").classList.add('hidden');\n    $("logoutBtn").hidden=false;\n\n    if(VIEW==='pending-receivable'){\n      const cached=restoreCache();\n      if(cached)await smartSync(true);else await loadPending(true);\n    }else if(VIEW==='pending-daily-cash'){\n      await loadPendingDailyCash(true);\n    }else if(VIEW==='pending-deposit'){\n      vaultCacheRestore();\n      await loadPendingDeposit(true);\n    }else if(VIEW==='deposit-history'){\n      await loadDepositHistory(true);\n    }\n    startSync();\n  }catch(error){\n    sessionToken='';deviceToken='';\n    $("logoutBtn").hidden=true;\n    $("loginOverlay").classList.remove('hidden');\n    const box=$("loginOverlay").querySelector('.loginbox');\n    if(box){\n      const h=box.querySelector('h2');if(h)h.textContent='🔐 Supabase Sign In Required';\n      const p=box.querySelector('p');if(p)p.textContent='Sign in to BIG BROTHER with an account that has Admin Work access.';\n    }\n    const accessField=$("accessCode")?.closest('.field');if(accessField)accessField.style.display='none';\n    const rememberRow=$("rememberDevice")?.closest('.remember-row');if(rememberRow)rememberRow.style.display='none';\n    if($("loginBtn"))$("loginBtn").style.display='none';\n    setLoginError(error?.message||'Admin Work access denied.');\n  }\n})();`;
    if(!html.includes(marker))throw new Error('Admin Work initialization marker was not found.');
    html=html.replace(marker,replacement);
    html=html.replace('<title>BIG BROTHER — Admin Work V6.1 Vault Includes Receivable Cash</title>','<title>BIG BROTHER — Admin Work Supabase</title>');

    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Admin Work<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
